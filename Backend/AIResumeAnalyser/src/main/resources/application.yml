spring:
  application:
    name: ai-resume-analyser

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ai_resume_db}
      auto-index-creation: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

# Groq (free tier - get key at https://console.groq.com)
groq:
  api:
    key: ${GROQ_API_KEY:your-groq-api-key-here}
    base-url: https://api.groq.com/openai/v1
  model: llama-3.3-70b-versatile
  max-tokens: 2000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.airesume: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: on-param
    include-binding-errors: on-param
