<div class="history-wrapper">

  <div class="history-header">
    <h1><mat-icon>history</mat-icon> Analysis History</h1>
    <button mat-raised-button color="primary" (click)="uploadNew()">
      <mat-icon>add</mat-icon> New Analysis
    </button>
  </div>

  <!-- Loading -->
  <ng-container *ngIf="loading()">
    <div class="loading-state">
      <div class="ai-spinner"></div>
      <p>Loading history…</p>
    </div>
  </ng-container>

  <!-- Empty state -->
  <ng-container *ngIf="!loading() && pagedData()?.content?.length === 0">
    <mat-card class="card-elevated empty-card">
      <mat-card-content>
        <mat-icon>inbox</mat-icon>
        <h3>No analyses yet</h3>
        <p>Upload your first resume to get started.</p>
        <button mat-raised-button color="primary" (click)="uploadNew()">
          <mat-icon>upload_file</mat-icon> Upload Resume
        </button>
      </mat-card-content>
    </mat-card>
  </ng-container>

  <!-- Table -->
  <ng-container *ngIf="!loading() && (pagedData()?.content?.length ?? 0) > 0">
    <mat-card class="card-elevated table-card fade-in-up">
      <mat-card-content>
        <table mat-table [dataSource]="pagedData()!.content" class="history-table">

          <!-- Filename -->
          <ng-container matColumnDef="filename">
            <th mat-header-cell *matHeaderCellDef>Resume</th>
            <td mat-cell *matCellDef="let row">
              <div class="filename-cell">
                <mat-icon color="primary">description</mat-icon>
                {{ row.originalFilename }}
              </div>
            </td>
          </ng-container>

          <!-- ATS Score -->
          <ng-container matColumnDef="atsScore">
            <th mat-header-cell *matHeaderCellDef>ATS Score</th>
            <td mat-cell *matCellDef="let row">
              <div class="score-chip {{ scoreClass(row.atsScore) }}">
                {{ row.atsScore }}
              </div>
            </td>
          </ng-container>

          <!-- Job Description -->
          <ng-container matColumnDef="jobDescription">
            <th mat-header-cell *matHeaderCellDef>Job Description</th>
            <td mat-cell *matCellDef="let row">
              <span
                *ngIf="row.jobDescription"
                class="jd-preview"
                [matTooltip]="row.jobDescription">
                {{ row.jobDescription | slice:0:60 }}…
              </span>
              <span *ngIf="!row.jobDescription" class="no-jd">—</span>
            </td>
          </ng-container>

          <!-- Date -->
          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef>Date</th>
            <td mat-cell *matCellDef="let row">
              {{ row.createdAt | date:'mediumDate' }}
            </td>
          </ng-container>

          <!-- Actions -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let row">
              <button
                mat-icon-button
                color="primary"
                (click)="viewAnalysis(row.id)"
                matTooltip="View full analysis">
                <mat-icon>open_in_new</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row"></tr>
        </table>

        <mat-paginator
          [length]="pagedData()!.totalElements"
          [pageSize]="pageSize"
          [pageIndex]="pageIndex"
          [pageSizeOptions]="[5, 10, 25]"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </mat-card-content>
    </mat-card>
  </ng-container>

</div>
